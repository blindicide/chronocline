[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronocline"
version = "0.6.0"
description = "Reproducible models and simulations for quantized timing channels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Chronocline contributors"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "pydantic>=2.5", "typer>=0.12", "pyyaml>=6.0", "joblib>=1.3", "tqdm>=4.66"]

[project.optional-dependencies]
pcap = ["scapy>=2.5"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
chronocline = "chronocline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chronocline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
