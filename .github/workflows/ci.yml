name: scientific-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src/chronocline
      - run: uv run pytest --cov=chronocline --cov-report=term-missing --cov-fail-under=88
      - run: uv build
      - run: |
          for config in configs/ci/*.yaml; do
            uv run chronocline experiment "$config"
            uv run chronocline validate-results "results/$(uv run python -c "import yaml; print(yaml.safe_load(open('$config'))['experiment']['name'])")"
          done
