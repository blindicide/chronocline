experiment:
  name: heavy_tailed_jitter
  seed: 20260728
  output_directory: results
  overwrite: false
  locale: en
  workers: 1
channel:
  mode: absolute_delay
  alphabet:
    values:
    - 0.0
    - 1.0
    unit: normalized
  input_probabilities: null
jitter:
