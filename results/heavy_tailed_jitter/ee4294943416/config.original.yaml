  lower: null
  upper: null
  weights: null
  means: null
  scales: null
quantizer:
  type: uniform
  step: 0.5
  phase: 0.0
  mode: floor
  random_phase: false
  quadrature_points: 32
matrix:
  tail_probability: 1.0e-10
  include_overflow_bins: true
optimization:
  method: blahut_arimoto
  tolerance: 1.0e-10
  max_iterations: 10000
constraints:
  max_kl_divergence: null
  max_mean_delay: null
sweep:
  parameters: {}
